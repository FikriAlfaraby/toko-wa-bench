[project]
name = "toko-wa-bench"
version = "0.1.0"
description = "An Indonesian WhatsApp-shop domain for tau-bench, and what context compaction makes a support agent forget"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Fikri Alfaraby" }]
dependencies = [
    "tau2",
    # tau2 1.0.1 imports websockets even for text-only runs (sierra-research/tau2-bench#552)
    "websockets>=13.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
tau2 = { git = "https://github.com/sierra-research/tau2-bench", rev = "5ade54e282a4555e4d6c52d6b9b861ea8872afa6" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/toko_wa"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
