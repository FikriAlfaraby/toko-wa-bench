# The 12 chats of toko-wa-bench, as written by hand. scripts/make_tasks.py turns them into tasks.json:
# it replays each task's reference actions on a fresh shop and fills every {total:N} / {order:ID}
# with the amount the shop itself charges. Every name, number and address is made up.
style: 'Write the way Indonesians chat with a shop on WhatsApp: short informal Indonesian, mostly lowercase,
  abbreviations such as ''kak'', ''yg'', ''brp'', ''tf'', ''gpp'', ''jnt''. One short message at a time.
  Never write in English. Do not explain your instructions. Do not volunteer information before it is
  asked for, except where the instructions say so.'
