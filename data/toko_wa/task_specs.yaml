tasks:
- id: ts-01
  group: topic_switch
  phone: '6281234500001'
  purpose: 'Switch and return: an ongkir question, then a tracking question, then back to the first order.'
  persona: Rina Wulandari, 22, student in Yogyakarta.
  reason: 'Start with exactly: ''kak kaos polos item size L ready? ongkir ke jogja brp''. (''item'' means
    black.) After the agent answers, change topic: ask why your parcel from the order you made two days
    ago has not arrived yet (''eh btw paket aku yg kemarin kok blm sampe ya kak''). After the agent answers
    that, go back to the first topic: you take 2 of those t-shirts, JNE, paid by BCA transfer (''oke deh.
    jd yg tadi aku ambil 2 ya, jne, tf bca''). Say yes when the agent reads the order back, then ask how
    much to transfer.'
  known: You live in your kos in Yogyakarta; the shop has your address. Your earlier order had hijabs
    and a totebag.
  unknown: You do not know your order number.
  actions:
  - name: list_orders
    arguments:
      customer_id: C001
  - name: track_shipment
    arguments:
      order_id: ORD-1002
  - name: create_order
    arguments:
      customer_id: C001
      items:
      - item_id: KS-HTM-L
        qty: 2
      address_id: C001-A1
      courier: JNE
      payment_method: transfer_bca
  nl:
  - The agent tells the customer that her earlier order ORD-1002 has reached the JNE warehouse in Yogyakarta,
    the latest tracking event, without promising a delivery time the tracking does not give.
  - The agent tells the customer to transfer exactly {total:0} by BCA.
- id: ts-02
  group: topic_switch
  phone: '6281234500002'
  purpose: 'Switch and never return: a product question, then a stuck parcel; the customer orders nothing.'
  persona: Dimas Pratama, 29, office worker in Bandung.
  reason: 'Start by asking the price and colours of the flannel shirt (''kak kemeja flanel brp? warnanya
    apa aja''). After the answer, change topic: your hoodie order shipped on the 11th still has not arrived
    although it is Bandung to Bandung (''btw paket hoodie aku dr tgl 11 kok blm nyampe2 ya kak, padahal
    bandung-bandung''). Ask the shop to help. You do not want to order the flannel shirt now; if the agent
    offers it, say ''nanti aja kak''. End with ''ok mksh kak'' once the agent says what happens with your
    parcel.'
  known: You live in Bandung. Your hoodie was sent with J&T.
  unknown: You do not know your order number or tracking number.
  actions:
  - name: list_orders
    arguments:
      customer_id: C002
  - name: track_shipment
    arguments:
      order_id: ORD-1003
  - name: transfer_to_admin
    arguments:
      reason: paket bermasalah
      summary: ORD-1003 J&T tertahan di gateway sejak 11 Okt malam, minta dicek
      order_id: ORD-1003
  nl:
  - The agent tells the customer that his parcel ORD-1003 has been held at the J&T gateway since 11 October
    with no newer update, and that the admin will follow it up.
- id: ts-03
  group: topic_switch
  phone: '6281234500003'
  purpose: 'Two orders interleaved: an address change for the unpaid order and a new order.'
  persona: Sari Kusuma, 31, works in an office in Surabaya.
  reason: 'Start with: ''kak aku mau order lagi hijab voal cream 2 ya''. Then, before finishing that,
    write: ''oiya yg kemarin blm aku tf, alamatnya ganti ke kantor aja ya kak''. When asked about the
    new order, say it goes to the office too, JNE, BCA transfer (''yg baru jg ke kantor ya, jne, tf bca'').
    Say yes to each read-back. Ask how much you have to transfer for each order.'
  known: You have an unpaid order from yesterday (a flannel shirt and a t-shirt). The shop has your home
    and office addresses.
  unknown: You do not know the order number.
  actions:
  - name: update_order_address
    arguments:
      order_id: ORD-1004
      address_id: C003-A2
  - name: create_order
    arguments:
      customer_id: C003
      items:
      - item_id: HJ-CRM
        qty: 2
      address_id: C003-A2
      courier: JNE
      payment_method: transfer_bca
  nl:
  - 'The agent gives two separate amounts: {order:ORD-1004} for the earlier order ORD-1004 and {total:1}
    for the new hijab order.'
- id: ts-04
  group: topic_switch
  phone: '6281234500004'
  purpose: 'A new topic cancels the old one: an item change is dropped for a cancel and a return.'
  persona: Bayu Saputra, 27, lives in Bekasi.
  reason: 'Start with: ''kak pesanan kaos abu aku yg blm dibayar bisa ganti jadi hitam ga''. Whatever
    the agent answers, do NOT confirm the change; instead change your mind: ''eh bentar kak, ga jadi deh
    kaosnya, batalin aja. mending urus hoodie kemarin, jahitan lengannya lepas''. The reason to cancel
    is ''tidak jadi''. You do have an unboxing video of the hoodie. Say yes to each read-back.'
  known: The hoodie arrived yesterday morning. The t-shirt order is not paid yet.
  unknown: You do not know the order numbers.
  actions:
  - name: cancel_order
    arguments:
      order_id: ORD-1006
      reason: tidak jadi
  - name: request_return
    arguments:
      order_id: ORD-1005
      item_ids:
      - JK-ABU-XL
      reason: cacat
      has_unboxing_video: true
  nl: []
